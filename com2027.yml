project_name: ReEngage

project_description: |
  This web application is designed to help anxious and neurodivergent students reconnect with formal education and keep up with their peers. 
  It uses interactive quizzes and games to enhance engagement while delivering content aligned with the national curriculum.

  By providing an accessible, safe and supportive learning environment, ReEngage encourages students to learn independently and build confidence.
  This project aims to address the UN's Sustainable Development Goal 4 (Quality Education) by making learning more inclusive for students facing educational challenges.

